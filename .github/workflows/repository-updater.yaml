name: Repository Updater

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types: ["update"]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      updater_token: ${{ steps.set-output.outputs.updater_token }}
    steps:
      - name: 🔐 Load 1Password secrets
        id: load-op
        uses: 1password/load-secrets-action@8d0d610af187e78a2772c2d18d627f4c52d3fbfb
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEY: "op://CI/Github Token/Anmeldedaten"

      - name: Set job output from KEY
        id: set-output
        run: |
          echo "updater_token=${KEY}" >> $GITHUB_OUTPUT

  repository_updater:
    needs: prepare
    uses: homeassistant-apps/workflows/.github/workflows/repository-updater.yaml@main
    secrets:
      UPDATER_TOKEN: ${{ needs.prepare.outputs.updater_token }}
